<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Spacer icon</title>
  <desc id="desc">A mint vector spaceship approaching an angular gray asteroid on a dark background.</desc>
  <rect width="128" height="128" rx="24" fill="#111923"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
