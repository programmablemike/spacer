      <path d="m-6 15 6 13 6-13" stroke-width="2"/>
    </g>
  </g>
  <g fill="#f3f3eb">
    <circle cx="57" cy="66" r="1.7"/>
    <circle cx="62" cy="61" r="1.7"/>
  </g>
  </g>
