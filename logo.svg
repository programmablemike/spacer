<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-labelledby="title desc">
  <title id="title">Spacer</title>
  <desc id="desc">A white vector spaceship firing at a jagged asteroid beside the Spacer wordmark on black.</desc>
  <rect width="640" height="160" rx="16" fill="#101112"/>
  <g transform="translate(16 16)">
  <g fill="none" stroke="#f3f3eb" stroke-width="2.5" stroke-linejoin="miter">
    <!-- Irregular, concave silhouette evokes a vector-arcade asteroid. -->
    <path d="m70 16 22-5 18 14-8 12 11 13-19 14-12-12-16 6-9-20 13-9-8-7Z"/>
    <!-- Narrow triangular hull, inset stern, and separate engine flame. -->
    <g transform="translate(36 89) rotate(42)">
