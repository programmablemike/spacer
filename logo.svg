<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-sm" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-xs" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="#080818"/>

  <!-- Stars -->
  <circle cx="22"  cy="10"  r="0.9" fill="#fff" opacity="0.7"/>
  <circle cx="55"  cy="6"   r="0.6" fill="#fff" opacity="0.5"/>
  <circle cx="175" cy="12"  r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="220" cy="5"   r="0.9" fill="#fff" opacity="0.7"/>
  <circle cx="265" cy="14"  r="0.6" fill="#fff" opacity="0.4"/>
  <circle cx="340" cy="7"   r="1.0" fill="#fff" opacity="0.8"/>
  <circle cx="420" cy="13"  r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="470" cy="6"   r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="580" cy="15"  r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="590" cy="8"   r="0.9" fill="#fff" opacity="0.7"/>
  <circle cx="8"   cy="70"  r="0.6" fill="#fff" opacity="0.4"/>
  <circle cx="12"  cy="120" r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="6"   cy="165" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="590" cy="55"  r="0.6" fill="#fff" opacity="0.4"/>
  <circle cx="595" cy="95"  r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="592" cy="145" r="0.6" fill="#fff" opacity="0.4"/>
  <circle cx="110" cy="175" r="0.8" fill="#fff" opacity="0.5"/>
  <circle cx="165" cy="188" r="0.6" fill="#fff" opacity="0.4"/>
  <circle cx="245" cy="180" r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="360" cy="185" r="0.9" fill="#fff" opacity="0.6"/>
  <circle cx="430" cy="178" r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="490" cy="188" r="0.8" fill="#fff" opacity="0.6"/>
  <circle cx="550" cy="173" r="0.6" fill="#fff" opacity="0.4"/>

  <!-- Large asteroid (top-right, behind text) -->
  <polygon points="535,18 558,28 565,50 555,70 535,78 512,68 507,48 518,28"
           stroke="#a855f7" stroke-width="1.5" fill="none" filter="url(#glow-sm)"/>

  <!-- Medium asteroid (top-left, partially overlaps S) -->
  <polygon points="75,34 90,42 94,56 85,68 70,70 56,60 54,46 62,34"
           stroke="#a855f7" stroke-width="1.5" fill="none" filter="url(#glow-sm)"/>

  <!-- SPACER — angular vector font, gold -->

  <!-- S  (offset 80, 22) -->
  <polyline points="140,22 90,22 80,32 80,54 90,64 130,64 140,74 140,84 130,92 80,92"
            stroke="#f5c518" stroke-width="2.5" fill="none" stroke-linejoin="miter" filter="url(#glow)"/>

  <!-- P  (offset 155, 22) -->
  <polyline points="155,92 155,22 197,22 215,36 215,56 197,64 155,64"
            stroke="#f5c518" stroke-width="2.5" fill="none" stroke-linejoin="miter" filter="url(#glow)"/>

  <!-- A  (offset 230, 22) -->
  <polyline points="230,92 260,22 290,92"
            stroke="#f5c518" stroke-width="2.5" fill="none" stroke-linejoin="miter" filter="url(#glow)"/>
  <line x1="240" y1="74" x2="280" y2="74" stroke="#f5c518" stroke-width="2.5" filter="url(#glow)"/>

  <!-- C  (offset 305, 22) -->
  <polyline points="365,34 353,22 317,22 305,34 305,80 317,92 353,92 365,80"
            stroke="#f5c518" stroke-width="2.5" fill="none" stroke-linejoin="miter" filter="url(#glow)"/>

  <!-- E  (offset 380, 22) -->
  <polyline points="440,22 380,22 380,92 440,92"
            stroke="#f5c518" stroke-width="2.5" fill="none" stroke-linejoin="miter" filter="url(#glow)"/>
  <line x1="380" y1="57" x2="422" y2="57" stroke="#f5c518" stroke-width="2.5" filter="url(#glow)"/>

  <!-- R  (offset 455, 22) -->
  <polyline points="455,92 455,22 497,22 515,36 515,56 497,64 455,64"
            stroke="#f5c518" stroke-width="2.5" fill="none" stroke-linejoin="miter" filter="url(#glow)"/>
  <line x1="483" y1="64" x2="515" y2="92" stroke="#f5c518" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Small asteroid (bottom-left) -->
  <polygon points="50,133 62,140 65,152 57,162 44,162 35,153 36,141 44,133"
           stroke="#a855f7" stroke-width="1.3" fill="none" filter="url(#glow-sm)"/>

  <!-- Small asteroid (bottom-center-left) -->
  <polygon points="200,139 211,145 212,156 203,163 191,160 188,150 194,140"
           stroke="#a855f7" stroke-width="1.2" fill="none" filter="url(#glow-xs)"/>

  <!-- Small asteroid (bottom-center-right) -->
  <polygon points="400,139 410,144 411,155 403,162 392,160 387,150 393,141"
           stroke="#a855f7" stroke-width="1.2" fill="none" filter="url(#glow-xs)"/>

  <!-- Small asteroid fragment (right, near large) -->
  <polygon points="520,115 535,122 538,136 528,145 514,144 507,133 511,120"
           stroke="#a855f7" stroke-width="1.2" fill="none" filter="url(#glow-xs)"/>

  <!-- Ship (pointing at large asteroid, upper-right) -->
  <polyline points="320,152 293,180 295,165 281,156 320,152"
            stroke="#f5c518" stroke-width="2" fill="none" stroke-linejoin="miter" filter="url(#glow)"/>

  <!-- Bullets (travelling toward large asteroid) -->
  <circle cx="347" cy="139" r="2.5" fill="#f5c518" filter="url(#glow)"/>
  <circle cx="392" cy="117" r="2.5" fill="#f5c518" filter="url(#glow)"/>
  <circle cx="437" cy="95"  r="2.5" fill="#f5c518" filter="url(#glow)"/>
</svg>
