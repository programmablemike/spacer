[package]
name = "spacer-data"
version = "0.0.1"
edition = "2021"
description = "Filesystem, JSON registry, and Git adapters for Spacer"
license = "MIT"

[dependencies]
spacer-core = { path = "../spacer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tempfile = "3"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
