name: Desktop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  frontend:
    name: desktop frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-ui-results
          path: desktop/test-results/
  native:
    name: desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundle: deb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundle: deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux webview prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb
      - name: Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --all-features --locked
      - name: Build native webview smoke binary
        run: cargo build --manifest-path desktop/src-tauri/Cargo.toml --features native-smoke,tauri/custom-protocol --locked
      - name: Native webview lifecycle
        run: |
          binary="desktop/src-tauri/target/debug/spacer-desktop${{ runner.os == 'Windows' && '.exe' || '' }}"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 python3 tests/desktop-native.py "$binary"
          else
            python3 tests/desktop-native.py "$binary"
          fi
      - name: Build desktop installer
        run: npm --prefix desktop run tauri -- build --ci --bundles "${{ matrix.bundle }}" -- --locked
      - name: Package installer and checksum
        run: python3 scripts/package-desktop.py "${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        with:
          name: desktop-package-${{ matrix.target }}
          path: dist/spacer-desktop-*
          if-no-files-found: error
