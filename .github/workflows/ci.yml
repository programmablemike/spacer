name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - name: Linux shells
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Tool versions
        run: |
          rustc --version
          git --version
          python3 --version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Install from clean source
        run: cargo install --path . --locked --root "$RUNNER_TEMP/spacer-install"
      - name: Installed CLI lifecycle
        run: python3 tests/smoke.py "$RUNNER_TEMP/spacer-install/bin/spacer${{ runner.os == 'Windows' && '.exe' || '' }}"
      - name: Interactive terminal behavior
        if: runner.os != 'Windows'
        run: python3 tests/terminal.py "$RUNNER_TEMP/spacer-install/bin/spacer"
      - name: Package and verify archive
        run: python3 scripts/package.py "$RUNNER_TEMP/spacer-install/bin/spacer${{ runner.os == 'Windows' && '.exe' || '' }}" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
