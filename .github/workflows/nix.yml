name: Nix
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: nix (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            system: aarch64-darwin
          - os: macos-15-intel
            system: x86_64-darwin
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/spacer-nix-cache
          key: nix-outputs-${{ matrix.system }}-${{ github.sha }}
          restore-keys: nix-outputs-${{ matrix.system }}-
      - name: Import cached build outputs
        run: |
          if [[ -f "$RUNNER_TEMP/spacer-nix-cache/paths" ]]; then
            # This is the job's branch-scoped Actions cache, not a public substituter.
            sudo "$(command -v nix)" copy --stdin \
              --from "file://$RUNNER_TEMP/spacer-nix-cache" --no-check-sigs \
              < "$RUNNER_TEMP/spacer-nix-cache/paths"
          fi
      - name: Build and check Nix packages
        id: build
        run: nix flake check --print-build-logs
      - name: Resolve tested outputs
        run: |
          nix build .#cli --out-link result-cli
          nix build .#desktop --out-link result-desktop
          nix build .#checks.${{ matrix.system }}.desktop-smoke --out-link result-smoke
      - name: Packaged CLI lifecycle
        run: python3 tests/smoke.py result-cli/bin/spacer
      - name: Packaged desktop lifecycle
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            dbus_package=$(nix eval --raw --inputs-from . nixpkgs#dbus.outPath)
            nix shell --inputs-from . nixpkgs#dbus nixpkgs#xvfb-run --command \
              dbus-run-session --config-file="$dbus_package/share/dbus-1/session.conf" -- \
              xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 \
              python3 tests/desktop-native.py result-smoke/bin/spacer-desktop --empty-path
          else
            python3 tests/desktop-native.py result-smoke/bin/spacer-desktop --empty-path
          fi
      - name: Application layout
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -x result-desktop/Applications/Spacer.app/Contents/MacOS/spacer-desktop
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' result-desktop/Applications/Spacer.app/Contents/Info.plist
          else
            test -f result-desktop/share/applications/Spacer.desktop
          fi
      - name: Export checked packages and their runtime dependencies
        if: always() && steps.build.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/spacer-nix-cache"
          nix eval --json .#checks.${{ matrix.system }} \
            --apply 'checks: builtins.map (name: checks.${name}.outPath) (builtins.attrNames checks)' \
            | python3 -c 'import json, sys; print("\n".join(json.load(sys.stdin)))' \
            | tee "$RUNNER_TEMP/spacer-nix-cache/paths" \
            | nix copy --stdin --to "file://$RUNNER_TEMP/spacer-nix-cache"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.build.outcome == 'success'
        with:
          path: ${{ runner.temp }}/spacer-nix-cache
          key: nix-outputs-${{ matrix.system }}-${{ github.sha }}
