name: Nix
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    name: nix (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            system: aarch64-darwin
          - os: macos-15-intel
            system: x86_64-darwin
          - os: ubuntu-24.04
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-${{ matrix.system }}-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ matrix.system }}-
      - name: Build and check Nix packages
        run: nix flake check --print-build-logs
      - name: Resolve tested outputs
        run: |
          nix build .#cli --out-link result-cli
          nix build .#desktop --out-link result-desktop
          nix build .#checks.${{ matrix.system }}.desktop-smoke --out-link result-smoke
      - name: Packaged CLI lifecycle
        run: python3 tests/smoke.py result-cli/bin/spacer
      - name: Packaged desktop lifecycle
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            nix shell --inputs-from . nixpkgs#dbus nixpkgs#xvfb-run --command \
              dbus-run-session -- xvfb-run -a env WEBKIT_DISABLE_COMPOSITING_MODE=1 \
              python3 tests/desktop-native.py result-smoke/bin/spacer-desktop --empty-path
          else
            python3 tests/desktop-native.py result-smoke/bin/spacer-desktop --empty-path
          fi
      - name: Application layout
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            test -x result-desktop/Applications/Spacer.app/Contents/MacOS/spacer-desktop
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' result-desktop/Applications/Spacer.app/Contents/Info.plist
          else
            test -f result-desktop/share/applications/Spacer.desktop
          fi
      - uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        if: always()
        with:
          primary-key: nix-${{ matrix.system }}-${{ github.sha }}
          gc-max-store-size-linux: 2G
          gc-max-store-size-macos: 2G
