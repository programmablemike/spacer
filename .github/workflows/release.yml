name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Validate tag and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check-release.py
          cd dist
          sha256sum --check *.sha256
      - name: Publish verified archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == v0.* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag "${flags[@]}" --title "Spacer $RELEASE_TAG" --notes-file RELEASE_NOTES.md dist/*
